<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#00237B" />

    <title>Pradera Islands Waterpark | Official Website – Lubao, Pampanga</title>
    <meta name="description" content="Official website of Pradera Islands Waterpark in Lubao, Pampanga. Book tickets, check rates and park hours, and explore slides, wave pools and rain parks at Pradera Verde." />

    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pradera Islands Waterpark | Official Website – Lubao, Pampanga" />
    <meta property="og:description" content="Official website of Pradera Islands Waterpark in Lubao, Pampanga. Book tickets, check rates and park hours, and explore slides, wave pools and rain parks at Pradera Verde." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pradera Islands Waterpark" />
    <meta name="twitter:description" content="The New Waters await — splash, flow, and celebrate at Central Luzon's vibrant new waterpark in Pampanga." />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Structured data. This is what lets Google show the address, the open
         days and the price band in search and on Maps, rather than just a blue
         link. Root-relative URLs here are made absolute at deploy time by
         scripts/og-absolute.js, which knows the address the site is served
         from. The telephone is the guest line, staffed during park hours. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "AmusementPark",
      "name": "Pradera Islands Waterpark",
      "description": "A waterpark in Lubao, Pampanga, built around Bayúng Danum — the arrival of new waters. Twelve attractions across slides, pools and rain parks.",
      "url": "/",
      "image": "/og-image.png",
      "logo": "/brand/logo-main.webp",
      "email": "sales@praderaislands.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Prado Siongco",
        "addressLocality": "Lubao",
        "addressRegion": "Pampanga",
        "addressCountry": "PH"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Thursday", "Friday"], "opens": "10:00", "closes": "17:00", "validFrom": "2026-11-15" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Saturday", "Sunday"], "opens": "09:00", "closes": "17:00", "validFrom": "2026-11-15" }
      ],
      "specialOpeningHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2026-11-16", "validThrough": "2026-11-18" },
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2026-11-30", "validThrough": "2026-11-30" },
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2026-12-08", "validThrough": "2026-12-08" },
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2026-12-11", "validThrough": "2026-12-11" },
        { "@type": "OpeningHoursSpecification", "opens": "10:00", "closes": "17:00", "validFrom": "2026-12-23", "validThrough": "2026-12-23" },
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2026-12-24", "validThrough": "2026-12-25" },
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2026-12-30", "validThrough": "2026-12-31" },
        { "@type": "OpeningHoursSpecification", "opens": "09:00", "closes": "17:00", "validFrom": "2027-01-01", "validThrough": "2027-01-01" }
      ],
      "telephone": "+63 977 810 0808",
      "priceRange": "₱864–₱1,380",
      "currenciesAccepted": "PHP",
      "isAccessibleForFree": false,
      "sameAs": [
        "https://www.facebook.com/people/Pradera-Islands-Waterpark/61576524087915/",
        "https://www.instagram.com/praderaislandswaterpark/",
        "https://www.tiktok.com/@praderawaterpark_"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Netlify Forms: static copy so the build bot registers the inquiry form before React renders -->
    <form name="inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" /><input type="tel" name="contact" /><input type="email" name="email" /><input type="date" name="visitDate" /><textarea name="message"></textarea><input type="text" name="bot-field" />
    </form>

  </body>
</html>
